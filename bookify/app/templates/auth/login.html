{% extends "base.html" %}{% import "_macros.html" as m %}
{% block title %}Log in{% endblock %}
{% block width %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Welcome back</h1><p class="muted">Log in to manage your bookings.</p>
  <form method="post" novalidate>{{ m.csrf() }}
    <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" value="{{ request.form.get('email','') }}" autocomplete="email" required autofocus></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
    <div class="field"><label class="check"><input type="checkbox" name="remember"> Keep me signed in</label></div>
    <button class="btn" style="width:100%" type="submit">Log in</button>
  </form>
  <p class="small muted" style="margin:16px 0 0">New here? <a href="{{ url_for('auth.register') }}">Create a customer account</a> · <a href="{{ url_for('auth.register_business') }}">Register a business</a></p>
</div>
{% endblock %}
